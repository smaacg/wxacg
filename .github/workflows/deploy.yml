name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 取得最新程式碼
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
        
    - name: 檢查 PHP 語法 (防止錯誤程式碼炸站)
      run: |
        if git rev-parse HEAD~1 >/dev/null 2>&1; then
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.php$' || true)
        else
          CHANGED_FILES=$(find . -name "*.php")
        fi
        
        if [ -n "$CHANGED_FILES" ]; then
          echo "$CHANGED_FILES" | xargs -n1 -P 8 php -l > /dev/null
        else
          echo "本次更新沒有修改 PHP 檔案，跳過檢查。"
        fi

    - name: 透過 FTP 同步檔案到主機
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: domains/weixiaoacg.com/public_html/
        protocol: ftps
        port: 21
        timeout: 120000
        exclude: |
          **/.git*
          **/.git*/**
          .github/**
          .vscode/**
